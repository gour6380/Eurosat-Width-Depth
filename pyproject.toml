[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat-width-depth"
version = "0.1.0"
description = "A bounded parameter-matched CNN width/depth experiment on EuroSAT RGB"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.13.0", "numpy==2.4.6", "pandas==3.0.6", "pillow==12.3.0",
  "tensorboard==2.21.0", "tqdm==4.70.1", "matplotlib==3.11.2",
  "seaborn==0.13.2", "psutil==7.2.2", "jupyterlab==4.6.3",
  "ipykernel==7.3.0", "ipywidgets==8.1.9",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
